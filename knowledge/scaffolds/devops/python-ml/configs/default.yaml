# Experiment configuration
seed: 42
output_dir: "outputs"

# Model architecture
model:
  input_dim: 784
  hidden_dim: 256
  output_dim: 10
  dropout: 0.2

# Training hyperparameters
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_patience: 5
  early_stopping_patience: 10
  num_workers: 0

# Data
data:
  train_path: "data/train.csv"
  test_path: "data/test.csv"
  target_column: "target"
  test_size: 0.2
  val_size: 0.1

# Logging
logging:
  log_interval: 10
  save_best: true
  save_last: true
