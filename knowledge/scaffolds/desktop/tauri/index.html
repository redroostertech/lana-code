<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tauri App</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>My Tauri App</h1>
    </header>
    <main>
      <section class="card">
        <h2>Greet from Rust</h2>
        <form id="greet-form">
          <input type="text" id="greet-input" placeholder="Enter a name..." />
          <button type="submit">Greet</button>
        </form>
        <p id="greet-output"></p>
      </section>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
