[package]
name = "my-tauri-app"
version = "0.1.0"
edition = "2021"
description = "A Tauri 2 desktop application"

[lib]
name = "my_tauri_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
